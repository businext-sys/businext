appId: com.businext.mobile
name: Agenda - se abre desde su pestaña y vuelve al asistente
---
- launchApp:
    clearState: true
- runFlow: ../subflows/login.yaml
- tapOn: "Agenda"
- extendedWaitUntil:
    visible:
      id: "agenda-day-label"
    timeout: 20000
- tapOn: "Asistente"
- extendedWaitUntil:
    visible: "¿En qué te ayudo hoy?"
    timeout: 20000

appId: com.businext.mobile
name: Agenda - es el inicio y abre el chat y vuelve
---
- launchApp:
    clearState: true
- runFlow: ../subflows/login.yaml
- assertVisible: "Agenda"
- tapOn:
    id: "agenda-chat-button"
- extendedWaitUntil:
    visible: "¿En qué te ayudo hoy?"
    timeout: 20000
- tapOn:
    id: "chat-menu-button"
- tapOn: "Agenda"
- extendedWaitUntil:
    visible:
      id: "agenda-day-label"
    timeout: 20000

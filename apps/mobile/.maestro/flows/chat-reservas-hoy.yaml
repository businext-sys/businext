appId: com.businext.mobile
name: Chat - chip Reservas de hoy devuelve la tarjeta de reservas
---
- launchApp:
    clearState: true
- runFlow: ../subflows/login.yaml
- extendedWaitUntil:
    visible: "¿En qué te ayudo hoy?"
    timeout: 20000
- tapOn: "Reservas de hoy"
- extendedWaitUntil:
    visible:
      id: "card-reservation-list"
    timeout: 30000

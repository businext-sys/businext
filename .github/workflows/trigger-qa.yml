# Tras un push a `staging`, Vercel redespliega el frontend (preview del
# branch staging, root apps/web). Este workflow espera a que ese preview
# responda y entonces dispara la suite del qa-runner via repository_dispatch.
#
# Requiere el secret QA_DISPATCH_TOKEN: un PAT con permiso para disparar
# repository_dispatch en businext-sys/businext-qa-runner (fine-grained:
# Contents Read/Write sobre ese repo; classic: scope `repo`).
name: Trigger QA on staging deploy

on:
  push:
    branches: [staging]

jobs:
  trigger-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for staging frontend
        run: |
          URL="https://businext-frontend-git-staging-daniflorezms-projects.vercel.app/"
          echo "Esperando deploy de Vercel + $URL ..."
          # Margen para que Vercel arranque el build tras el push.
          sleep 45
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$URL" || echo 000)
            if [ "$code" = "200" ]; then echo "frontend up"; exit 0; fi
            echo "intento $i: HTTP $code, reintentando en 10s"; sleep 10
          done
          echo "El frontend de staging no respondio a tiempo"; exit 1

      - name: Dispatch qa-runner
        run: |
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.QA_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/businext-sys/businext-qa-runner/dispatches \
            -d '{"event_type":"staging-deployed","client_payload":{"source":"frontend","sha":"${{ github.sha }}","ref":"${{ github.ref_name }}"}}'
          echo "repository_dispatch enviado (source=frontend)"

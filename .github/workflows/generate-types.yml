name: generate-types

# Regenera packages/shared-core/src/api/generated-types.ts a partir del
# OpenAPI schema de businext-backend y abre un PR con los cambios.
#
# Issue #018 (Fase 3).
#
# Disparadores:
# - repository_dispatch (type: backend-openapi-updated): pensado para que
#   businext-backend lo dispare automaticamente al mergear a main (ver
#   README de packages/shared-core para el detalle de configuracion
#   pendiente en ese repo).
# - workflow_dispatch: para regenerar manualmente desde la UI de Actions.

on:
  repository_dispatch:
    types: [backend-openapi-updated]
  workflow_dispatch:
    inputs:
      openapi_url:
        description: "URL del openapi.json del backend (por defecto usa el secret/variable OPENAPI_URL del repo)"
        required: false
        type: string

jobs:
  generate-types:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate types from OpenAPI
        env:
          OPENAPI_URL: ${{ inputs.openapi_url || vars.OPENAPI_URL || secrets.OPENAPI_URL }}
        run: pnpm --filter @businext/shared-core generate:types

      - name: Type-check shared-core with the new types
        run: pnpm --filter @businext/shared-core type-check

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- packages/shared-core/src/api/generated-types.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request with updated types
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: regenera generated-types.ts desde el OpenAPI del backend"
          branch: bot/generate-types
          delete-branch: true
          title: "chore: actualiza tipos generados desde OpenAPI del backend"
          body: |
            PR automatico del workflow `generate-types.yml` (issue #018).

            Regenera `packages/shared-core/src/api/generated-types.ts` a
            partir del OpenAPI schema actual de `businext-backend`.

            Revisar si algun mapper en `packages/shared-core/src/mappers/`
            necesita actualizarse por cambios de forma en el backend.
          labels: |
            chore
            generated

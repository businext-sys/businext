name: Claude Code

# Asistente interactivo: responde a menciones "@claude" en issues, comentarios
# de PR y reviews, y puede implementar un issue de forma autonoma cuando se le
# aplica la etiqueta "claude-implement".

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude-implement') ||
      (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Necesario para que Claude lea resultados de CI en los PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Etiquetar un issue con "claude-implement" dispara la
          # implementacion autonoma (reemplaza el workflow_dispatch manual
          # de opencode-run.yml).
          label_trigger: "claude-implement"

      # claude-code-action nunca abre el PR por si mismo cuando se dispara
      # sobre un issue (su propio prompt le indica dejar solo un link para
      # crearlo a mano, y su allowedTools no incluye "gh pr create"). Este
      # paso determinista toma la branch que Claude acaba de pushear y abre
      # el PR, para que el flujo label -> implementacion -> PR quede
      # completamente automatico.
      - name: Auto-crear PR desde la branch de Claude
        if: |
          github.event_name == 'issues' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'claude-implement'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -e
          git fetch --no-tags --depth=1 origin \
            "refs/heads/claude/issue-${ISSUE_NUMBER}-*:refs/remotes/origin/claude/issue-${ISSUE_NUMBER}-*" \
            2>/dev/null || true

          BRANCH=$(git for-each-ref --sort=-committerdate \
            --format='%(refname:short)' \
            "refs/remotes/origin/claude/issue-${ISSUE_NUMBER}-*" | head -n1 | sed 's#^origin/##')

          if [ -z "$BRANCH" ]; then
            echo "No se encontro branch de Claude para el issue #${ISSUE_NUMBER}; no habia cambios que pushear (pregunta/revision, no implementacion)."
            exit 0
          fi

          EXISTING_PR=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "Ya existe el PR #$EXISTING_PR para $BRANCH, no se crea uno nuevo."
            exit 0
          fi

          TITLE=$(git log -1 --format=%s "origin/$BRANCH")
          BODY=$(git log -1 --format=%b "origin/$BRANCH")
          FULL_BODY=$(printf '%s\n\nCloses #%s\n\n🤖 PR creado automáticamente por el workflow `claude-implement` a partir de la branch `%s`.' "$BODY" "$ISSUE_NUMBER" "$BRANCH")

          gh pr create --repo "${{ github.repository }}" \
            --base main \
            --head "$BRANCH" \
            --title "${TITLE:-Implementa: ${ISSUE_TITLE}}" \
            --body "$FULL_BODY"

name: opencode-run

# Ejecuta opencode en modo autonomo (sin TUI) contra un issue del repo.
# Usa las credenciales de GitHub Copilot del usuario, restauradas desde
# el secret OPENCODE_AUTH_JSON.
#
# Disparable manualmente desde la UI de GitHub Actions o via API
# (workflow_dispatch) por el bot de WhatsApp en fases posteriores.

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Numero del issue a implementar"
        required: true
        type: number
      model:
        description: "Modelo (formato provider/model). Ej: github-copilot/claude-sonnet-4.6"
        required: false
        default: "github-copilot/claude-sonnet-4.6"
        type: string

jobs:
  run:
    runs-on: ubuntu-latest

    # Permisos necesarios para que opencode pueda:
    # - Leer el issue                  (issues: read)
    # - Crear branches y commits       (contents: write)
    # - Abrir PRs                      (pull-requests: write)
    # - Comentar en issues             (issues: write)
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure git user
        run: |
          git config user.name "opencode-bot"
          git config user.email "opencode-bot@users.noreply.github.com"

      - name: Restore opencode credentials from secret
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          if [ -z "$OPENCODE_AUTH_JSON" ]; then
            echo "ERROR: secret OPENCODE_AUTH_JSON no configurado en el repo."
            echo "Sigue las instrucciones del README para generarlo."
            exit 1
          fi
          mkdir -p "$HOME/.local/share/opencode"
          printf '%s' "$OPENCODE_AUTH_JSON" > "$HOME/.local/share/opencode/auth.json"
          chmod 600 "$HOME/.local/share/opencode/auth.json"
          echo "auth.json restaurado en $HOME/.local/share/opencode/"

      - name: Install opencode CLI
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Verify opencode auth
        run: |
          opencode --version
          opencode auth list

      - name: Read issue body
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.issue_number }},
            });
            core.setOutput('title', issue.title);
            core.setOutput('number', issue.number.toString());
            // Guardar body en env para evitar problemas de escape en el prompt
            core.exportVariable('ISSUE_BODY', issue.body || '(sin descripcion)');
            core.exportVariable('ISSUE_TITLE', issue.title);
            core.exportVariable('ISSUE_NUMBER', issue.number.toString());

      - name: Create working branch
        run: |
          BRANCH="opencode/issue-${ISSUE_NUMBER}"
          git checkout -b "$BRANCH"
          echo "BRANCH_NAME=$BRANCH" >> "$GITHUB_ENV"

      - name: Run opencode against the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROMPT=$(cat <<EOF
          Estas trabajando en el repositorio ${{ github.repository }} sobre la branch ${BRANCH_NAME}.

          Debes implementar el siguiente issue de GitHub:

          Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}

          Descripcion:
          ${ISSUE_BODY}

          Instrucciones:
          1. Implementa los cambios necesarios en el filesystem del workspace actual.
          2. Cumple TODOS los criterios de aceptacion listados en la descripcion.
          3. No abras PRs ni hagas push; solo modifica archivos.
          4. Al terminar, describe brevemente que hiciste.
          EOF
          )

          opencode run \
            --model "${{ inputs.model }}" \
            --auto \
            "$PROMPT"

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "opencode no genero cambios. Abortando."
            exit 1
          fi
          git add -A
          git commit -m "feat: implementa #${ISSUE_NUMBER} - ${ISSUE_TITLE}"
          git push origin "$BRANCH_NAME"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "feat: resuelve #${ISSUE_NUMBER} - ${ISSUE_TITLE}" \
            --body "Implementacion automatica por opencode. Closes #${ISSUE_NUMBER}." \
            --base main \
            --head "${BRANCH_NAME}"

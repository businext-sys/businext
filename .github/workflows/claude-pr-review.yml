name: Claude PR Review

# Revision automatica de cada PR (sin necesidad de mencionar "@claude"):
# calidad de codigo, seguridad, performance, tests y documentacion, con
# comentarios inline sobre el diff.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review-with-tracking:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: PR Review with Progress Tracking
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Realiza una revision de codigo completa con foco en:

            1. **Calidad de codigo**
               - Principios de codigo limpio y buenas practicas
               - Manejo de errores y casos borde
               - Legibilidad y mantenibilidad

            2. **Seguridad**
               - Vulnerabilidades potenciales
               - Validacion/sanitizacion de inputs
               - Logica de autenticacion/autorizacion

            3. **Performance**
               - Cuellos de botella potenciales
               - Eficiencia de queries
               - Fugas de memoria o de recursos

            4. **Tests**
               - Cobertura adecuada
               - Calidad de los tests y casos borde
               - Escenarios de test faltantes

            5. **Documentacion**
               - Codigo bien documentado donde corresponda
               - README actualizado si aplica

            Usa comentarios inline para issues especificos y comentarios de
            nivel superior para observaciones generales.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
